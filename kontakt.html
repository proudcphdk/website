<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt | Proud Cph</title>
    <meta name="description" content="Kontakt Proud Cph for samarbejde, support eller pressehenvendelser." />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="sub-hero">
      <nav class="nav nav-light">
        <a class="logo" href="index.html">Proud Cph</a>
        <div class="nav-actions">
          <a class="nav-link dark" href="shop.html">Shop</a>
          <a class="nav-link dark" href="funktioner.html">Funktioner</a>
          <a class="nav-link dark" href="betalinger.html">Betalinger</a>
          <a class="nav-link dark" href="medarbejder.html">Medarbejder</a>
          <a class="btn btn-small btn-dark" href="kontakt.html">Kontakt</a>
        </div>
      </nav>
      <div class="sub-hero-content">
        <h1>Lad os bygge Proud Cphs næste store drop</h1>
        <p>Book en gennemgang af webshop, marketing flows og checkout setup.</p>
      </div>
    </header>

    <main class="section">
      <section class="card">
        <form class="contact-form" onsubmit="return false;">
          <input type="text" id="name" placeholder="Dit navn" required />
          <input type="email" id="email" placeholder="Din e-mail" required />
          <textarea id="message" rows="5" placeholder="Hvad vil du have hjælp til?"></textarea>
          <button class="btn btn-dark" type="submit" id="sendBtn">Send besked</button>
          <p class="status" id="status"></p>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p>© <span id="year"></span> Proud Cph</p>
      <p class="footer-links">
        <a href="handelsbetingelser.html">Handelsbetingelser</a>
        <a href="privatlivspolitik.html">Privatlivspolitik</a>
        <a href="retur.html">Retur & ombytning</a>
      </p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
